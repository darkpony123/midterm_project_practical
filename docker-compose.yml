services:
  db:
    image: postgres:16
    container_name: bounty_db
    env_file: .env
    volumes:
      - bounty_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bounty_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./app
    container_name: bounty_api
    env_file: .env
    ports:
      - "${APP_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - bounty_net

volumes:
  bounty_data:

networks:
  bounty_net:
